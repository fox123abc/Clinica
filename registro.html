<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Clínica Altavida</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/componentes.css">
</head>
<body>

  <header class="encabezado">
    <div class="contenedor">
      <a href="index.html" class="marca">Clínica Altavida</a>
      <nav class="nav-principal" aria-label="Navegación principal">
        <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="menu-principal">
          Menú
        </button>
        <ul class="nav-principal__enlaces" id="menu-principal">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="especialidades.html">Especialidades</a></li>
          <li><a href="login.html">Ingresar</a></li>
          <li><a href="registro.html">Registrarme</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="contenedor seccion">
    <h1>Crear tu cuenta de paciente</h1>
    <p>
      Con tu cuenta podrás solicitar citas, consultarlas y darles seguimiento.
    </p>

    <!--
      Nota: los campos siguientes corresponden a los "datos personales mínimos"
      mencionados en la definición del proyecto. Si se requieren campos
      adicionales (ej. tipo y número de documento), deben confirmarse antes
      de agregarlos.
    -->
    <form class="formulario" action="#" method="post" novalidate>
      <div class="campo campo--obligatorio">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name" required>
      </div>

      <div class="campo campo--obligatorio">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="email" required>
      </div>

      <div class="campo campo--obligatorio">
        <label for="telefono">Teléfono de contacto</label>
        <input type="tel" id="telefono" name="telefono" autocomplete="tel" required>
      </div>

      <div class="campo campo--obligatorio">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="new-password" required>
      </div>

      <button type="submit" class="boton boton--primario boton--ancho-completo">Crear cuenta</button>

      <p class="campo__ayuda">
        ¿Ya tienes cuenta? <a href="login.html">Ingresa aquí</a>.
      </p>
    </form>
  </main>

  <footer class="pie-pagina">
    <div class="contenedor">
      <span>&copy; 2026 Clínica Altavida. Proyecto académico con fines demostrativos.</span>
    </div>
  </footer>

  <script src="assets/js/navegacion.js"></script>
</body>
</html>
