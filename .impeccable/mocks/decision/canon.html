<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Estándar</title>
<style>
  body{margin:0;width:1440px;height:900px;background:#fff;color:#111827;font-family:Arial,sans-serif;overflow:hidden}
  .barra{display:flex;justify-content:space-between;padding:22px 64px;border-bottom:1px solid #E5E7EB;font-weight:700;font-size:18px}
  .cuerpo{display:grid;grid-template-columns:1fr 1fr;gap:56px;padding:72px 64px}
  h1{font-size:64px;line-height:1.05;margin:0 0 20px}

  .accion{display:inline-block;margin-top:28px;background:#2563EB;color:#fff;font-weight:700;font-size:20px;padding:16px 28px;border-radius:10px}
  .foto{background:#DBEAFE;border-radius:24px;height:520px}
</style></head><body>
<div class="barra"><span>Clínica Altavida</span><span>Inicio · Especialidades · Ingresar</span></div>
<div class="cuerpo"><div><h1>Agenda tu cita médica en línea</h1><p class="sub">Consulta la disponibilidad de nuestros especialistas y reserva en minutos.</p><span class="accion">Agendar cita</span></div><div class="foto"></div></div>
</body></html>
