<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cita registrada | Clínica Altavida</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/componentes.css">
  <link rel="stylesheet" href="../../assets/css/privado.css">
</head>
<body>

  <div class="franja-sesion" id="franja-sesion" v-cloak>
    <div class="contenedor">
      <span class="franja-sesion__usuario">
        <span class="franja-sesion__avatar" aria-hidden="true">{{ inicial }}</span>
        <span class="franja-sesion__nombre">Sesión iniciada como: <strong>{{ nombre }}</strong></span>
      </span>
      <a href="../login.html" class="franja-sesion__accion" @click.prevent="salir">Cerrar sesión</a>
    </div>
  </div>

  <header class="encabezado">
    <div class="contenedor">
      <a href="../../index.html" class="marca">Clínica Altavida</a>
      <nav class="nav-principal" aria-label="Navegación del área de paciente">
        <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="menu-principal">
          Menú
        </button>
        <ul class="nav-principal__enlaces" id="menu-principal">
          <li><a href="solicitud-cita.html">Solicitar cita</a></li>
          <li><a href="mis-citas.html">Mis citas</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Página gestionada por Vue.js (assets/js/vue/confirmacion.js) -->
  <main class="contenedor seccion" id="app-confirmacion" v-cloak>
    <div class="confirmacion">
      <template v-if="cita">
        <div class="confirmacion__icono" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <h1>Tu solicitud fue registrada</h1>
        <p class="aviso">
          Tu cita queda con estado pendiente hasta que la clínica la confirme.
        </p>

        <dl class="resumen-cita">
          <dt>Especialidad</dt>
          <dd>{{ cita.especialidad }}</dd>

          <dt>Médico</dt>
          <dd>{{ cita.medico }}</dd>

          <dt>Fecha</dt>
          <dd>{{ fechaLegible }}</dd>

          <dt>Horario</dt>
          <dd>{{ cita.horario }}</dd>

          <template v-if="cita.motivo">
            <dt>Motivo</dt>
            <dd>{{ cita.motivo }}</dd>
          </template>

          <dt>Estado</dt>
          <dd><etiqueta-estado :estado="cita.estado"></etiqueta-estado></dd>
        </dl>
      </template>

      <template v-else>
        <div class="confirmacion__icono confirmacion__icono--error" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>
        </div>
        <h1>No encontramos la cita</h1>
        <p class="aviso aviso--error">La cita que buscas no existe o no pertenece a tu cuenta.</p>
      </template>

      <div class="acciones">
        <a href="mis-citas.html" class="boton boton--primario">Ir a Mis citas</a>
        <a href="solicitud-cita.html" class="boton boton--contorno">Solicitar otra cita</a>
      </div>
    </div>
  </main>

  <footer class="pie-pagina">
    <div class="contenedor">
      <span>&copy; 2026 Clínica Altavida. Proyecto académico con fines demostrativos.</span>
    </div>
  </footer>

  <script src="../../assets/js/navegacion.js"></script>
  <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
  <script src="../../assets/js/vue/comun.js"></script>
  <script src="../../assets/js/vue/confirmacion.js"></script>
</body>
</html>
